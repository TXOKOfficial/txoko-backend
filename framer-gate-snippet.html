<!-- ═══════════════════════════════════════════════════════
  TXOKO — GATE WIRING
  Paste into: Site Settings → Code → Add → End of <body>, applied to All pages.

  Three jobs, all done at runtime against the markup Framer publishes, so
  nothing here depends on editing the canvas:

  1. HOME — the "ENTER ACCESS CODE" control is designed as a link straight
     to /services, with no field to type into. This turns it into a real
     input, copying the typography from the label it replaces, and wires
     the arrow and the Enter key to verify the code.

  2. /request-access — the native Framer form already names its fields
     name, email, city, guests, preferredMonth and message. Its submit is
     intercepted and posted to the backend, then the visitor lands on
     /access-requested. Framer's hidden spam-trap fields are ignored.

  3. /services — visitors who never verified a code are sent back to the
     gate. A courtesy redirect, not a security boundary: Framer has no
     server-side control, so this stops the curious, not the determined.

  If any element is missing the script leaves the page untouched rather
  than breaking it.
═══════════════════════════════════════════════════════ -->

<script>
(function () {
  var API_BASE = "https://txoko-backend.vercel.app/api";
  var INNER_PATH = "/services";
  var REQUESTED_PATH = "/access-requested";
  var STORAGE_KEY = "txoko_access";

  // Backend field names, keyed by the names Framer already uses.
  var FIELD_MAP = {
    name: "name",
    email: "email",
    city: "city",
    guests: "guests",
    preferredMonth: "month",
    message: "message",
  };

  // ── Feedback line ─────────────────────────────────────
  // Uses a layer named GateMessage when one exists; otherwise it creates a
  // line under the gate so errors are never silent.
  function ensureMessageEl(anchor) {
    var existing =
      document.querySelector('[data-framer-name="GateMessage"]') ||
      document.getElementById("txoko-message");
    if (existing) return existing;
    if (!anchor || !anchor.parentElement) return null;

    var el = document.createElement("div");
    el.id = "txoko-message";
    el.style.cssText =
      "font-family:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;" +
      "margin-top:10px;min-height:14px;opacity:0;transition:opacity .2s;";
    anchor.parentElement.insertBefore(el, anchor.nextSibling);
    return el;
  }

  var messageAnchor = null;

  function showMessage(text, isError) {
    var el = ensureMessageEl(messageAnchor);
    if (!el) return;
    el.textContent = text;
    el.style.color = isError ? "#c8776b" : "rgba(236,227,213,0.7)";
    el.style.opacity = "1";
  }

  // ── 1. Gate: turn the dead link into a real input ─────
  function upgradeGate() {
    var link = null;
    var anchors = document.querySelectorAll("a");
    for (var i = 0; i < anchors.length; i++) {
      var href = anchors[i].getAttribute("href") || "";
      if (/access code/i.test(anchors[i].innerText || "") && /services/.test(href)) {
        link = anchors[i];
        break;
      }
    }
    if (!link || link.dataset.txokoGate) return;

    var label = null;
    var paragraphs = link.querySelectorAll("p");
    for (var j = 0; j < paragraphs.length; j++) {
      if (/access code/i.test(paragraphs[j].textContent || "")) {
        label = paragraphs[j];
        break;
      }
    }
    if (!label) return;

    link.dataset.txokoGate = "1";
    messageAnchor = link;

    var cs = window.getComputedStyle(label);
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = (label.textContent || "Enter access code").trim();
    input.setAttribute("aria-label", "Access code");
    input.setAttribute("autocomplete", "off");
    input.spellcheck = false;

    // Inherit the typography of the label being replaced, so the field
    // keeps looking like the design even if the styles change later.
    [
      "fontFamily",
      "fontSize",
      "fontWeight",
      "letterSpacing",
      "textTransform",
      "lineHeight",
    ].forEach(function (prop) {
      input.style[prop] = cs[prop];
    });
    input.style.color = "rgb(236,227,213)"; // typed text, full strength
    input.style.background = "transparent";
    input.style.border = "0";
    input.style.outline = "none";
    input.style.padding = "0";
    input.style.margin = "0";
    input.style.width = "100%";

    // The placeholder keeps the muted tone the label had.
    if (!document.getElementById("txoko-gate-style")) {
      var style = document.createElement("style");
      style.id = "txoko-gate-style";
      style.textContent =
        "#txoko-code::placeholder{color:" + cs.color + ";opacity:1;}";
      document.head.appendChild(style);
    }
    input.id = "txoko-code";

    label.parentNode.replaceChild(input, label);

    // The link must stop navigating: it used to walk straight in.
    link.removeAttribute("href");
    link.style.cursor = "text";
    link.addEventListener(
      "click",
      function (e) {
        e.preventDefault();
        input.focus();
      },
      true
    );

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        verifyCode(input);
      }
    });

    // The arrow becomes the submit control.
    var arrow = null;
    for (var k = 0; k < paragraphs.length; k++) {
      if (/[→>]/.test(paragraphs[k].textContent || "")) {
        arrow = paragraphs[k].parentElement || paragraphs[k];
        break;
      }
    }
    if (arrow) {
      arrow.style.cursor = "pointer";
      arrow.addEventListener(
        "click",
        function (e) {
          e.preventDefault();
          e.stopPropagation();
          verifyCode(input);
        },
        true
      );
    }
  }

  async function verifyCode(input) {
    var code = (input.value || "").trim();
    if (!code) {
      showMessage("Please enter your code.", true);
      return;
    }

    showMessage("Verifying…", false);
    try {
      var r = await fetch(API_BASE + "/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code }),
      });
      var data = await r.json();
      if (data.valid) {
        try {
          sessionStorage.setItem(STORAGE_KEY, "1");
        } catch (e) {}
        window.location.href = INNER_PATH;
      } else {
        showMessage(data.error || "That code is not valid.", true);
      }
    } catch (e) {
      showMessage("Connection error. Please try again.", true);
    }
  }

  // ── 2. Access request form ────────────────────────────
  function collectFields(form) {
    var payload = {};
    Object.keys(FIELD_MAP).forEach(function (formName) {
      var field = form.querySelector('[name="' + formName + '"]');
      // offsetParent filters out Framer's hidden honeypot inputs.
      if (field && field.offsetParent !== null) {
        payload[FIELD_MAP[formName]] = (field.value || "").trim();
      }
    });
    return payload;
  }

  async function submitRequest(form) {
    var payload = collectFields(form);

    if (!payload.name || !payload.email) {
      showMessage("Please enter your name and email.", true);
      return;
    }

    showMessage("Sending your request…", false);
    try {
      var r = await fetch(API_BASE + "/request-access", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      var data = await r.json();
      if (data.ok) {
        window.location.href = REQUESTED_PATH;
      } else {
        showMessage(data.error || "Your request could not be sent.", true);
      }
    } catch (e) {
      showMessage("Connection error. Please try again.", true);
    }
  }

  function wireRequestForm() {
    var forms = document.querySelectorAll("form");
    Array.prototype.forEach.call(forms, function (form) {
      if (form.dataset.txokoWired) return;
      if (!form.querySelector('[name="email"]') || !form.querySelector('[name="name"]')) return;
      form.dataset.txokoWired = "1";
      messageAnchor = messageAnchor || form;

      // Capture phase, so Framer's own submit handler does not also run.
      form.addEventListener(
        "submit",
        function (e) {
          e.preventDefault();
          e.stopPropagation();
          submitRequest(form);
        },
        true
      );
    });
  }

  // ── 3. Courtesy guard on the inner page ───────────────
  function guardInnerPage() {
    if (window.location.pathname.indexOf(INNER_PATH) !== 0) return;
    var granted = false;
    try {
      granted = sessionStorage.getItem(STORAGE_KEY) === "1";
    } catch (e) {
      granted = true; // storage blocked: never lock a visitor out over this
    }
    if (!granted) window.location.replace("/");
  }

  function init() {
    upgradeGate();
    wireRequestForm();
  }

  guardInnerPage();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  // Framer navigates client-side, so re-run the wiring as the DOM changes.
  new MutationObserver(function () {
    init();
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
