<!-- ═══════════════════════════════════════════════════════
  TXOKO — GATE WIRING
  Paste into: Site Settings → Code → Add → End of <body>, applied to All pages.

  This hooks into the site as it is actually built:

  · /request-access has a native Framer form whose fields are already named
    name, email, city, guests, preferredMonth and message. The script
    intercepts its submit, posts to the backend and sends the visitor to
    /access-requested. Framer's own hidden spam-trap fields are ignored.

  · The gate needs a real text input for the access code. Give that input
    the layer name "CodeInput" in Framer (or an input named "code") and the
    script will find it. The submit control next to it should be named
    "EnterButton".

  · /services is the page a valid code unlocks.
═══════════════════════════════════════════════════════ -->

<script>
(function () {
  var API_BASE = "https://txoko-backend.vercel.app/api";
  var INNER_PATH = "/services";
  var REQUESTED_PATH = "/access-requested";
  var STORAGE_KEY = "txoko_access";

  // Fields the backend accepts, mapped from the names Framer already uses.
  var FIELD_MAP = {
    name: "name",
    email: "email",
    city: "city",
    guests: "guests",
    preferredMonth: "month",
    message: "message",
  };

  function findMessageEl() {
    return (
      document.querySelector('[data-framer-name="GateMessage"]') ||
      document.getElementById("gate-message")
    );
  }

  function showMessage(text, isError) {
    var el = findMessageEl();
    if (el) {
      el.textContent = text;
      el.style.color = isError ? "#a33" : "inherit";
      el.style.opacity = "1";
      return;
    }
    // No message layer on the page yet: fall back to something visible so a
    // failure is never silent.
    if (isError) window.alert(text);
  }

  // ── Access request form ───────────────────────────────
  // Reads only the fields we know about. Framer adds hidden honeypot inputs
  // (website, company, subject, title...) that must not be forwarded.
  function collectFields(form) {
    var payload = {};
    Object.keys(FIELD_MAP).forEach(function (formName) {
      var field = form.querySelector('[name="' + formName + '"]');
      if (field && field.offsetParent !== null) {
        payload[FIELD_MAP[formName]] = (field.value || "").trim();
      }
    });
    return payload;
  }

  async function submitRequest(form) {
    var payload = collectFields(form);

    if (!payload.name || !payload.email) {
      showMessage("Please enter your name and email.", true);
      return;
    }

    showMessage("Sending your request…", false);
    try {
      var r = await fetch(API_BASE + "/request-access", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      var data = await r.json();
      if (data.ok) {
        window.location.href = REQUESTED_PATH;
      } else {
        showMessage(data.error || "Your request could not be sent.", true);
      }
    } catch (e) {
      showMessage("Connection error. Please try again.", true);
    }
  }

  function wireRequestForm() {
    var forms = document.querySelectorAll("form");
    Array.prototype.forEach.call(forms, function (form) {
      if (form.dataset.txokoWired) return;
      // Only the form that carries the fields we expect.
      if (!form.querySelector('[name="email"]') || !form.querySelector('[name="name"]')) return;
      form.dataset.txokoWired = "1";

      // Capture phase so Framer's own handler does not also fire.
      form.addEventListener(
        "submit",
        function (e) {
          e.preventDefault();
          e.stopPropagation();
          submitRequest(form);
        },
        true
      );
    });
  }

  // ── Access code entry ─────────────────────────────────
  function findCodeInput() {
    var wrapper = document.querySelector('[data-framer-name="CodeInput"]');
    if (wrapper) {
      var inner = wrapper.querySelector("input");
      if (inner) return inner;
      if (wrapper.tagName === "INPUT") return wrapper;
    }
    return document.querySelector('input[name="code"]') || document.getElementById("access-code");
  }

  async function verifyCode() {
    var input = findCodeInput();
    var code = input ? (input.value || "").trim() : "";
    if (!code) {
      showMessage("Please enter your code.", true);
      return;
    }

    showMessage("Verifying…", false);
    try {
      var r = await fetch(API_BASE + "/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code }),
      });
      var data = await r.json();
      if (data.valid) {
        try {
          sessionStorage.setItem(STORAGE_KEY, "1");
        } catch (e) {}
        window.location.href = INNER_PATH;
      } else {
        showMessage(data.error || "That code is not valid.", true);
      }
    } catch (e) {
      showMessage("Connection error. Please try again.", true);
    }
  }

  function wireGate() {
    var input = findCodeInput();
    if (!input || input.dataset.txokoWired) return;
    input.dataset.txokoWired = "1";

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        verifyCode();
      }
    });

    var button =
      document.querySelector('[data-framer-name="EnterButton"]') ||
      document.getElementById("access-submit");
    if (button) {
      button.addEventListener(
        "click",
        function (e) {
          e.preventDefault();
          e.stopPropagation();
          verifyCode();
        },
        true
      );
    }
  }

  // ── Courtesy guard on the inner page ──────────────────
  // Not a security boundary: Framer offers no server-side control, so this
  // only redirects visitors who never went through the gate.
  function guardInnerPage() {
    if (window.location.pathname.indexOf(INNER_PATH) !== 0) return;
    var granted = false;
    try {
      granted = sessionStorage.getItem(STORAGE_KEY) === "1";
    } catch (e) {
      granted = true; // storage blocked: do not lock anyone out
    }
    if (!granted) window.location.replace("/");
  }

  function init() {
    wireRequestForm();
    wireGate();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  // Framer navigates client-side, so re-wire when the DOM changes.
  var observer = new MutationObserver(function () {
    init();
  });
  observer.observe(document.body, { childList: true, subtree: true });

  // guardInnerPage(); // ← uncomment once the gate has a real code input
})();
</script>
