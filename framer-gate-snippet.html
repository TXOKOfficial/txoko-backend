<!-- ═══════════════════════════════════════════════════════
  SNIPPET FOR THE FRAMER GATE
  Paste into: Site Settings → General → Custom Code → End of <body>

  BEFORE IT WORKS, CHECK ONE THING:

  The selectors below must match your Framer layers. In Framer, name a
  layer in the right-hand panel and it becomes targetable as
  [data-framer-name="LayerName"]. Rename the gate and form layers to match
  the names used below and nothing else needs touching.

  Page paths are already set to this project: /services is unlocked by a
  valid code, /access-requested is where a submitted form lands.

  The form sends six fields: name, email, city, guests, month, message.
  Only name and email are required; the rest are passed through to the
  owner's email so they can decide without writing back to ask.
═══════════════════════════════════════════════════════ -->

<script>
(function () {
  const API_BASE = "https://txoko-backend.vercel.app/api";

  // The page a valid code unlocks.
  const INNER_PATH = "/services";

  // Where to land after a request is submitted successfully.
  const REQUESTED_PATH = "/access-requested";

  const $ = (sel) => document.querySelector(sel);

  // Reads a value from a Framer layer, falling back to a plain element id.
  function readField(layerName, elementId) {
    const el =
      $('[data-framer-name="' + layerName + '"] input') ||
      $('[data-framer-name="' + layerName + '"] textarea') ||
      $("#" + elementId);
    return el ? el.value.trim() : "";
  }

  const codeInput = () =>
    $('[data-framer-name="CodeInput"] input') || $("#access-code");
  const submitBtn = () =>
    $('[data-framer-name="EnterButton"]') || $("#access-submit");
  const requestBtn = () =>
    $('[data-framer-name="RequestButton"]') || $("#request-access");
  const messageEl = () =>
    $('[data-framer-name="GateMessage"]') || $("#gate-message");

  function showMessage(text, isError) {
    const el = messageEl();
    if (el) {
      el.textContent = text;
      el.style.color = isError ? "#a33" : "#1a1a1a";
      el.style.opacity = "1";
    }
  }

  // ── Verify a code ──
  async function verifyCode() {
    const input = codeInput();
    const code = input ? input.value.trim() : "";
    if (!code) return showMessage("Please enter your code.", true);

    showMessage("Verifying…", false);
    try {
      const r = await fetch(API_BASE + "/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code }),
      });
      const data = await r.json();
      if (data.valid) {
        // Remember access so the code is not asked again this session
        sessionStorage.setItem("txoko_access", "1");
        window.location.href = INNER_PATH;
      } else {
        showMessage(data.error || "That code is not valid.", true);
      }
    } catch (e) {
      showMessage("Connection error. Please try again.", true);
    }
  }

  // ── Request access ──
  async function requestAccess() {
    const payload = {
      name: readField("NameInput", "request-name"),
      email: readField("EmailInput", "request-email"),
      city: readField("CityInput", "request-city"),
      guests: readField("GuestsInput", "request-guests"),
      month: readField("MonthInput", "request-month"),
      message: readField("MessageInput", "request-message"),
    };

    if (!payload.name || !payload.email) {
      return showMessage("Please enter your name and email.", true);
    }

    showMessage("Sending your request…", false);
    try {
      const r = await fetch(API_BASE + "/request-access", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await r.json();
      if (data.ok) {
        showMessage(data.message, false);
        window.location.href = REQUESTED_PATH;
      } else {
        showMessage(data.error || "Your request could not be sent.", true);
      }
    } catch (e) {
      showMessage("Connection error. Please try again.", true);
    }
  }

  // ── Wiring ──
  document.addEventListener("DOMContentLoaded", function () {
    const enter = submitBtn();
    const request = requestBtn();
    if (enter)
      enter.addEventListener("click", function (e) {
        e.preventDefault();
        verifyCode();
      });
    if (request)
      request.addEventListener("click", function (e) {
        e.preventDefault();
        requestAccess();
      });

    // Pressing Enter in the code field also verifies
    const input = codeInput();
    if (input)
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          verifyCode();
        }
      });
  });

  // ── Basic guard on the inner page ──
  // Paste this same script globally and uncomment to bounce anyone who
  // lands on the inner page without going through the gate.
  //
  // Note: this is a courtesy redirect, not a security boundary. Framer has
  // no server-side control, so anyone who wants in can still get in.
  //
  // if (window.location.pathname.startsWith(INNER_PATH) &&
  //     !sessionStorage.getItem("txoko_access")) {
  //   window.location.href = "/";
  // }
})();
</script>
